version: 2.1

# gen3 resource classes are only valid with the `current` tag, not a pinned
# dated tag -- a pinned tag is rejected with "is not a valid resource class"
_machine_image: &machine_image
  image: ubuntu-2604:current

# Every machine job gets large.gen3 (4 vCPUs, 16GiB). The doc builds are
# dominated by Sphinx's parallel read phase, which scales with cores, and both
# integration builds now use them: MNE's Makefile passes -j auto, and the
# scikit-learn build passes SPHINX_NUMJOBS=auto (see build_docs_skl.sh).
# gen3 is an open beta, and is both faster and cheaper per minute than gen1
# large (14 vs 20 credits/min); revert to `large` if beta queue times or
# reliability become a problem.
# https://discuss.circleci.com/t/changes-to-remote-docker-reporting-pricing/47759
_imageconfig: &imageconfig
  machine:
    <<: *machine_image
  resource_class: large.gen3

commands:
  bash_env:
    steps:
      - run:
          name: Set BASH_ENV
          command: |
            ./.circleci/setup_bash.sh

jobs:
  setup_env:
    <<: *imageconfig
    steps:
      # Get our data and merge with upstream
      - checkout
      - run:
          name: Merge with upstream
          command: |
            echo $(git log -1 --pretty=%B) | tee gitlog.txt
            echo ${CI_PULL_REQUEST//*pull\//} | tee merge.txt
            if [[ $(cat merge.txt) != "" ]] && [[ $(cat gitlog.txt) != *"[circle nomerge]"*  ]]; then
              echo "Merging $(cat merge.txt)";
              git pull --ff-only origin "refs/pull/$(cat merge.txt)/merge";
            fi
      - bash_env
      - restore_cache:
          keys:
            - cache-uv-1
      - run:
          name: Install dependencies
          command: |
            pip install --upgrade --only-binary ":all:" pip setuptools uv
            uv pip install --upgrade --only-binary ":all:" \
                numpy matplotlib seaborn statsmodels pillow joblib \
                "sphinx!=7.3.2,!=7.3.3,!=7.3.4,!=7.3.5,!=7.3.6" pytest \
                traits memory_profiler "ipython!=8.7.0" kaleido graphviz \
                "pyvista>=0.44.0" "docutils>=0.18" imageio pydata-sphinx-theme \
                "jupyterlite-sphinx>=0.17.1" "jupyterlite-pyodide-kernel" \
                libarchive-c "sphinxcontrib-video>=0.2.1rc0" intersphinx_registry \
                sphinx-design
            # TODO: restore PyPI plotly above once a plotly release newer than
            # 7.0.0 is out (plotly/plotly.py#5701 is merged but unreleased)
            uv pip install "plotly @ git+https://github.com/plotly/plotly.py@main"
      - save_cache:
          key: cache-uv-1
          paths:
            - ~/.cache/uv
      - run:
          name: Test libs
          command: |
            python -c "import pyvista;print(pyvista.Report())"
      - run:
          name: Install
          command: |
            uv pip install -e .
      - persist_to_workspace:
          root: ~/
          paths:
            - project
            - python_env

  build_docs:
    <<: *imageconfig
    steps:
      - attach_workspace:
          at: ~/
      - bash_env
      - run:
          name: Get a browser for plotly static image export
          command: |
            # The image's own browser exits after the first kaleido export
            # (killing the docs build), so fetch a known-good Chrome instead.
            plotly_get_chrome -y
      - run: sphinx-build doc doc/_build/html -nW --keep-going -b html 2>&1 | tee sphinx_log.txt
      - run:
          name: Check sphinx log for warnings (which are treated as errors)
          when: always
          command: |
            ! grep "^.*\(WARNING\|ERROR\): " sphinx_log.txt
      - store_artifacts:
          path: doc/_build/html/
          destination: html
      - store_test_results:
          path: doc/_build/html/
      - persist_to_workspace:
          root: doc/_build/html
          paths: .

  build_tinyhtml:
    <<: *imageconfig
    steps:
      - attach_workspace:
          at: ~/
      - bash_env
      - run: make -C sphinx_gallery/tests/tinybuild/doc clean html
      - store_artifacts:
          path: sphinx_gallery/tests/tinybuild/doc/_build/html
          destination: tiny_html

  build_latexpdf:
    <<: *imageconfig
    steps:
      - attach_workspace:
          at: ~/
      - bash_env
      - run:
          name: Get LaTeX tools
          command: |
            sudo apt install texlive texlive-latex-extra latexmk tex-gyre
      - run:
          name: latexpdf
          command: |
            make -C sphinx_gallery/tests/tinybuild/doc clean latexpdf
      - store_artifacts:
          path: sphinx_gallery/tests/tinybuild/doc/_build/latex/
          destination: latex

  build_docs_mne:
    <<: *imageconfig
    steps:
      - checkout  # just to get SSH keys set up
      - attach_workspace:
          at: ~/
      - bash_env
      - run:
          command: ./.circleci/build_docs_mne.sh
      - store_artifacts:
          path: mne-python/doc/_build/html/
          destination: docs_mne

  build_docs_skl:
    <<: *imageconfig
    steps:
      - checkout  # just to get SSH keys set up
      - attach_workspace:
          at: ~/
      - bash_env
      - run:
          command: ./.circleci/build_docs_skl.sh
      - store_artifacts:
          path: scikit-learn/doc/_build/html/stable
          destination: docs_skl

  deploy_dev:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "87:18:18:25:10:8c:29:0f:25:bd:28:b1:4f:cd:af:96"
      - attach_workspace:
          at: html
      - run: ./.circleci/docs_deploy.sh html dev

  deploy_stable:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "87:18:18:25:10:8c:29:0f:25:bd:28:b1:4f:cd:af:96"
      - attach_workspace:
          at: html
      - run: ./.circleci/docs_deploy.sh html stable


workflows:
  version: 2
  default:
    jobs:
      # https://circleci.com/docs/2.0/workflows/#executing-workflows-for-a-git-tag
      # Run for all branches and tags
      - setup_env: &filter_tags
          filters:
            tags:
              only: /.*/
      - build_docs:
          requires:
            - setup_env
          <<: *filter_tags
      - build_tinyhtml:
          requires:
            - setup_env
          <<: *filter_tags
      - build_latexpdf:
          requires:
            - setup_env
          <<: *filter_tags
      # integration tests
      - build_docs_mne:
          requires:
            - setup_env
          <<: *filter_tags
      - build_docs_skl:
          requires:
            - setup_env
          <<: *filter_tags
      # Run for master branch
      - deploy_dev:
          requires:
            - build_docs
          filters:
            branches:
              only: master
      # Run for tags named vX.Y.Z
      - deploy_stable:
          requires:
            - build_docs
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
