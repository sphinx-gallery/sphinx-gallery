name: 'Tests'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  style:
    name: 'Quick checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install check-manifest
      - run: check-manifest
  pytest:
    name: '${{ matrix.os }} / ${{ matrix.python }} / ${{ matrix.distrib }} / ${{ matrix.sphinx_version }}'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHON_VERSION: '${{ matrix.python }}'
      SPHINX_VERSION: '${{ matrix.sphinx_version }}'
      DISTRIB: '${{ matrix.distrib }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest  # newest possible
            python: '3.13'
            sphinx_version: dev
            distrib: pip
            locale: C
          - os: ubuntu-latest
            python: '3.11'
            sphinx_version: '6'
            distrib: mamba
          - os: ubuntu-latest
            python: '3.10'
            sphinx_version: '7'
            distrib: minimal
          - os: ubuntu-latest
            python: '3.13'
            sphinx_version: '8'
            distrib: pip
          - os: ubuntu-latest
            python: '3.14'
            sphinx_version: '9'
            distrib: pip
          - os: macos-latest
            python: '3.12'
            sphinx_version: 'default'
            distrib: pip
          - os: windows-latest
            python: '3.11'
            sphinx_version: 'default'
            distrib: pip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Xvfb/OpenGL
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      # Python (if pip)
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        if: matrix.distrib != 'mamba'
      # Python (if conda)
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test
          init-shell: bash
          create-args: >-
            python=${{ env.PYTHON_VERSION }} pip numpy setuptools matplotlib pillow
            pytest pytest-cov coverage seaborn statsmodels plotly joblib wheel libiconv
            pygraphviz memory_profiler ipython pypandoc lxml conda-libmamba-solver
            ffmpeg intersphinx-registry
        if: matrix.distrib == 'mamba'
      # Make sure that things work even if the locale is set to C (which
      # effectively means ASCII). Some of the input rst files have unicode
      # characters and we need to deal with this gracefully.
      - name: Set env vars
        shell: bash -e {0}
        run: |
          echo "LC_ALL=C" >> $GITHUB_ENV
          echo "LANG=C" >> $GITHUB_ENV
          echo "LC_CTYPE=C" >> $GITHUB_ENV
        if: matrix.locale == 'C'
      - run: .github/install.sh
      # Explicit counts (in the spirit of SciPy's CI) rather than -n auto, so the
      # number does not silently change with the runner image; macOS runners have
      # fewer cores and less RAM than the others. Above ~4 there is nothing to gain
      # anyway: test_full.py is a single xdist_group, and so the critical path.
      - name: Set number of pytest-xdist workers
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "PYTEST_XDIST_N=2" | tee -a $GITHUB_ENV
          else
            echo "PYTEST_XDIST_N=4" | tee -a $GITHUB_ENV
          fi
      - run: pytest sphinx_gallery -v --tb=short -n "$PYTEST_XDIST_N"
      - name: Remove incompatible doc config entries
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            CMD="sed -i ''"
          else
            CMD="sed -i"
          fi
          $CMD "/compress_images/d" doc/conf.py
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
      # -j goes in SPHINXOPTS: bare `make -j auto` is a make flag, and with a
      # single target it parallelizes nothing. SPHINXOPTS is overridden (rather
      # than appended to) to keep dropping the Makefile's -nWT --keep-going, so
      # the Makefile's own -j auto has to be repeated here.
      - run: make -C doc SPHINXOPTS="-j auto" html-noplot
        if: matrix.distrib != 'minimal'
      - run: make -C doc SPHINXOPTS="-j auto" html
        if: matrix.distrib != 'minimal'
      - uses: codecov/codecov-action@v7
