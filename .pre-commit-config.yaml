repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
        exclude: plot_syntaxerror
      - id: ruff
        args: ["--select=I", "--fix"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        files: ^sphinx_gallery/|^doc/|^.*_examples/|^tutorials/
        types_or: [python, bib, rst, inc]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.2
    hooks:
      - id: sphinx-lint

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.0
    hooks:
      - id: pyproject-fmt
        additional_dependencies: [tox]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ty-pre-commit
    # 0.0.76 turns the "no uv.lock" uv-metadata warning into a counted diagnostic
    # (exit 1) with no way to suppress it: https://github.com/astral-sh/ty/issues/4225
    rev: v0.0.75
    hooks:
      - id: ty
        additional_dependencies:
          - numpy
          - threadpoolctl
          - types-docutils
          - types-Pillow
          - types-Pygments
          - sphinx <9.1  # last to support 3.10
        args: [--no-python-downloads, --no-project]
